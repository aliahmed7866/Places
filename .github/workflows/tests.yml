name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q
      - run: python -m compileall -q app.py migrate_aycf.py termux
      - run: bash -n termux/install.sh && bash -n termux/run.sh
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check static/places.js
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pytest playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q tests/test_browser.py
        env:
          BROWSER_ARTIFACT_DIR: browser-artifacts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: places-map-planner
          path: browser-artifacts/
          if-no-files-found: ignore
